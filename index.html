<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Khoa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0f0f1a;
            overflow: hidden;
        }

        .anime-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(45deg, #ff0080, #00ffcc, #ffcc00, #cc00ff);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            opacity: 0.7;
        }

        .anime-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(15, 15, 26, 0.7);
        }

        .anime-characters {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .character {
            position: absolute;
            width: 150px;
            height: 200px;
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.6;
        }

        .character:nth-child(1) {
            top: 10%;
            left: 5%;
            background-image: url('https://i.pinimg.com/originals/5c/8f/f3/5c8ff3d6a8e9d6e4d4c4e4b4e4b4e4b4.png');
            animation: float 8s ease-in-out infinite;
        }

        .character:nth-child(2) {
            top: 60%;
            right: 5%;
            background-image: url('https://i.pinimg.com/originals/9c/1f/8a/9c1f8a4e4b4e4b4e4b4e4b4e4b4e4b4.png');
            animation: float 10s ease-in-out infinite 1s;
        }

        .character:nth-child(3) {
            bottom: 10%;
            left: 15%;
            background-image: url('https://i.pinimg.com/originals/7c/3f/8a/7c3f8a4e4b4e4b4e4b4e4b4e4b4e4b4.png');
            animation: float 12s ease-in-out infinite 2s;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 400px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            z-index: 1;
        }

        .login-title {
            color: #fff;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .login-subtitle {
            color: #ccc;
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: #fff;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #ff0080;
            box-shadow: 0 0 10px rgba(255, 0, 128, 0.5);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #ff0080, #cc00ff);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 0, 128, 0.4);
        }

        .message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }

        .success {
            background: rgba(0, 255, 0, 0.2);
            color: #0f0;
            border: 1px solid #0f0;
        }

        .error {
            background: rgba(255, 0, 0, 0.2);
            color: #f00;
            border: 1px solid #f00;
        }

        .footer {
            margin-top: 20px;
            color: #aaa;
            font-size: 0.8rem;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(5deg);
            }
            100% {
                transform: translateY(0) rotate(0deg);
            }
        }

        @media (max-width: 500px) {
            .login-container {
                width: 90%;
                padding: 30px 20px;
            }
            
            .character {
                width: 100px;
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="anime-background">
        <div class="anime-overlay"></div>
        <div class="anime-characters">
            <div class="character"></div>
            <div class="character"></div>
            <div class="character"></div>
        </div>
    </div>

    <div class="login-container">
        <h1 class="login-title">Chào mừng</h1>
        <p class="login-subtitle">Đăng nhập vào tài khoản của Khoa</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Tên đăng nhập</label>
                <input type="text" id="username" placeholder="Nhập tên đăng nhập">
            </div>
            
            <div class="input-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu">
            </div>
            
            <button type="submit" class="login-btn">Đăng nhập</button>
        </form>
        
        <div id="message" class="message"></div>
        
        <div class="footer">
            Tài khoản: khoa | Mật khẩu: khoadeptrai
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const message = document.getElementById('message');
            
            if (username === 'khoa' && password === 'khoadeptrai') {
                message.textContent = 'Đăng nhập thành công! Chào mừng Khoa đẹp trai!';
                message.className = 'message success';
                message.style.display = 'block';
                
                // Chuyển hướng sau 2 giây
                setTimeout(() => {
                    window.location.href = 'dashboard.html'; // Thay đổi URL này theo nhu cầu
                }, 2000);
            } else {
                message.textContent = 'Tên đăng nhập hoặc mật khẩu không đúng!';
                message.className = 'message error';
                message.style.display = 'block';
            }
        });
    </script>
</body>
</html>
