<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Khoa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0f0f1a;
            overflow: hidden;
        }

        .anime-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(45deg, #ff0080, #00ffcc, #ffcc00, #cc00ff);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            opacity: 0.7;
        }

        .anime-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(15, 15, 26, 0.7);
        }

        .anime-characters {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .character {
            position: absolute;
            width: 150px;
            height: 200px;
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.6;
            filter: brightness(0.8) saturate(1.2);
        }

        .character:nth-child(1) {
            top: 10%;
            left: 5%;
            background-image: url('https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/6f5b5c5c-6c5c-4c5c-9c5c-6c5c5c5c5c5c/dg1v1v1-5c5c5c5c-5c5c-5c5c-5c5c-5c5c5c5c5c5c.png?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7InBhdGgiOiJcL2ZcLzZmNWI1YzVjLTZjNWMtNGM1Yy05YzVjLTZjNWM1YzVjNWM1Y1wvZGcxdjF2MS01YzVjNWM1Yy01YzVjLTVjNWMtNWM1Yy01YzVjNWM1YzVjNWMucG5nIn1dXSwiYXVkIjpbInVybjpzZXJ2aWNlOmZpbGUuZG93bmxvYWQiXX0.7Q7Q7Q7Q7Q7Q7Q7Q7Q7Q7Q7Q7Q7Q7Q7Q7Q7Q7Q7Q');
            animation: float 8s ease-in-out infinite;
        }

        .character:nth-child(2) {
            top: 60%;
            right: 5%;
            background-image: url('https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/6f5b5c5c-6c5c-4c5c-9c5c-6c5c5c5c5c5c/dg1v1v2-5c5c5c5c-5c5c-5c5c-5c5c-5c5c5c5c5c5c.png?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7InBhdGgiOiJcL2ZcLzZmNWI1YzVjLTZjNWMtNGM1Yy05YzVjLTZjNWM1YzVjNWM1Y1wvZGcxdjF2Mi01YzVjNWM1Yy01YzVjLTVjNWMtNWM1Yy01YzVjNWM1YzVjNWMucG5nIn1dXSwiYXVkIjpbInVybjpzZXJ2aWNlOmZpbGUuZG93bmxvYWQiXX0.8Q8Q8Q8Q8Q8Q8Q8Q8Q8Q8Q8Q8Q8Q8Q8Q8Q8Q8Q8Q');
            animation: float 10s ease-in-out infinite 1s;
        }

        .character:nth-child(3) {
            bottom: 10%;
            left: 15%;
            background-image: url('https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/6f5b5c5c-6c5c-4c5c-9c5c-6c5c5c5c5c5c/dg1v1v3-5c5c5c5c-5c5c-5c5c-5c5c-5c5c5c5c5c5c.png?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7InBhdGgiOiJcL2ZcLzZmNWI1YzVjLTZjNWMtNGM1Yy05YzVjLTZjNWM1YzVjNWM1Y1wvZGcxdjF2My01YzVjNWM1Yy01YzVjLTVjNWMtNWM1Yy01YzVjNWM1YzVjNWMucG5nIn1dXSwiYXVkIjpbInVybjpzZXJ2aWNlOmZpbGUuZG93bmxvYWQiXX0.9Q9Q9Q9Q9Q9Q9Q9Q9Q9Q9Q9Q9Q9Q9Q9Q9Q9Q9Q9Q');
            animation: float 12s ease-in-out infinite 2s;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 400px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            z-index: 1;
        }

        .login-title {
            color: #fff;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .login-subtitle {
            color: #ccc;
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: #fff;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #ff0080;
            box-shadow: 0 0 10px rgba(255, 0, 128, 0.5);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #ff0080, #cc00ff);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 0, 128, 0.4);
        }

        .message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }

        .success {
            background: rgba(0, 255, 0, 0.2);
            color: #0f0;
            border: 1px solid #0f0;
        }

        .error {
            background: rgba(255, 0, 0, 0.2);
            color: #f00;
            border: 1px solid #f00;
        }

        .footer {
            margin-top: 20px;
            color: #aaa;
            font-size: 0.8rem;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(5deg);
            }
            100% {
                transform: translateY(0) rotate(0deg);
            }
        }

        @media (max-width: 500px) {
            .login-container {
                width: 90%;
                padding: 30px 20px;
            }
            
            .character {
                width: 100px;
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="anime-background">
        <div class="anime-overlay"></div>
        <div class="anime-characters">
            <div class="character"></div>
            <div class="character"></div>
            <div class="character"></div>
        </div>
    </div>

    <div class="login-container">
        <h1 class="login-title">Chào mừng</h1>
        <p class="login-subtitle">Đăng nhập vào tài khoản của Khoa</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Tên đăng nhập</label>
                <input type="text" id="username" placeholder="Nhập tên đăng nhập">
            </div>
            
            <div class="input-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu">
            </div>
            
            <button type="submit" class="login-btn">Đăng nhập</button>
        </form>
        
        <div id="message" class="message"></div>
        
        <div class="footer">
            Tài khoản: khoa | Mật khẩu: khoadeptrai
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const message = document.getElementById('message');
            
            if (username === 'khoa' && password === 'khoadeptrai') {
                message.textContent = 'Đăng nhập thành công! Chào mừng Khoa đẹp trai!';
                message.className = 'message success';
                message.style.display = 'block';
                
                // Tạo hiệu ứng chuyển trang
                document.querySelector('.login-container').style.animation = 'fadeOut 1s forwards';
                setTimeout(() => {
                    // Tạo trang dashboard đơn giản
                    document.body.innerHTML = `
                        <div class="dashboard">
                            <div class="dashboard-content">
                                <h1>Chào mừng Khoa đẹp trai!</h1>
                                <p>Bạn đã đăng nhập thành công</p>
                                <button onclick="location.reload()" class="logout-btn">Đăng xuất</button>
                            </div>
                        </div>
                    `;
                    
                    // Thêm style cho dashboard
                    const style = document.createElement('style');
                    style.textContent = `
                        .dashboard {
                            display: flex;
                            justify-content: center;
                            align-items: center;
                            min-height: 100vh;
                            background: linear-gradient(45deg, #ff0080, #00ffcc, #ffcc00, #cc00ff);
                            background-size: 400% 400%;
                            animation: gradientShift 15s ease infinite;
                        }
                        .dashboard-content {
                            background: rgba(255, 255, 255, 0.2);
                            padding: 40px;
                            border-radius: 20px;
                            text-align: center;
                            backdrop-filter: blur(10px);
                            color: white;
                        }
                        .logout-btn {
                            padding: 10px 20px;
                            background: #ff0080;
                            border: none;
                            border-radius: 10px;
                            color: white;
                            cursor: pointer;
                            margin-top: 20px;
                        }
                    `;
                    document.head.appendChild(style);
                }, 1000);
            } else {
                message.textContent = 'Tên đăng nhập hoặc mật khẩu không đúng!';
                message.className = 'message error';
                message.style.display = 'block';
                
                // Hiệu ứng lắc form khi nhập sai
                document.querySelector('.login-container').style.animation = 'shake 0.5s';
                setTimeout(() => {
                    document.querySelector('.login-container').style.animation = '';
                }, 500);
            }
        });

        // Thêm keyframe animation cho hiệu ứng lắc
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-10px); }
                75% { transform: translateX(10px); }
            }
            @keyframes fadeOut {
                from { opacity: 1; transform: scale(1); }
                to { opacity: 0; transform: scale(0.8); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
