<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Khoa Đẹp Trai</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #000;
            overflow: hidden;
        }

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .video-background video {
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
        }

        .login-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 50px;
            width: 450px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            z-index: 1;
            position: relative;
        }

        .login-title {
            color: #fff;
            font-size: 3rem;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.7);
            font-weight: bold;
        }

        .login-subtitle {
            color: #e0e0e0;
            margin-bottom: 40px;
            font-size: 1.2rem;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: #fff;
            margin-bottom: 10px;
            font-size: 1rem;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            color: #fff;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #ff2d95;
            box-shadow: 0 0 20px rgba(255, 45, 149, 0.6);
            background: rgba(255, 255, 255, 0.2);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(45deg, #ff2d95, #ff6b6b);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .login-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(255, 45, 149, 0.4);
            background: linear-gradient(45deg, #ff6b6b, #ff2d95);
        }

        .message {
            margin-top: 25px;
            padding: 15px;
            border-radius: 10px;
            display: none;
            font-weight: bold;
        }

        .success {
            background: rgba(0, 255, 100, 0.2);
            color: #00ff64;
            border: 2px solid #00ff64;
        }

        .error {
            background: rgba(255, 50, 50, 0.2);
            color: #ff3232;
            border: 2px solid #ff3232;
        }

        .footer {
            margin-top: 25px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        .music-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 2;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .music-control i {
            color: white;
            font-size: 1.5rem;
        }

        .dashboard {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            text-align: center;
        }

        .dashboard-content {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 60px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 600px;
        }

        .dashboard h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #ff2d95;
            text-shadow: 0 0 20px rgba(255, 45, 149, 0.7);
        }

        .dashboard p {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: #e0e0e0;
        }

        .logout-btn {
            padding: 15px 40px;
            background: linear-gradient(45deg, #ff2d95, #ff6b6b);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 45, 149, 0.4);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .fade-in {
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px rgba(255, 255, 255, 0.7); }
            50% { text-shadow: 0 0 20px rgba(255, 255, 255, 0.9), 0 0 30px rgba(255, 45, 149, 0.5); }
        }

        .glow-text {
            animation: glow 2s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <!-- Video Background -->
    <div class="video-background">
        <video id="bgVideo" autoplay muted loop>
            <!-- THAY THẾ ĐƯỜNG DẪN NÀY BẰNG VIDEO CỦA BẠN -->
            <source src="background-video.mp4" type="video/mp4">
            <!-- Dự phòng nếu video không load được -->
            <source src="https://assets.codepen.io/3364143/7btrrd.mp4" type="video/mp4">
        </video>
        <div class="video-overlay"></div>
    </div>

    <!-- Music Control -->
    <div class="music-control" id="musicControl">
        <i>🔊</i>
    </div>

    <!-- Login Form -->
    <div class="login-container fade-in">
        <h1 class="login-title glow-text">Khoa</h1>
        <p class="login-subtitle">Đăng nhập vào thế giới anime</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Tên đăng nhập</label>
                <input type="text" id="username" placeholder="Nhập tên đăng nhập" autocomplete="off">
            </div>
            
            <div class="input-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu" autocomplete="off">
            </div>
            
            <button type="submit" class="login-btn">ĐĂNG NHẬP</button>
        </form>
        
        <div id="message" class="message"></div>
        
        <div class="footer">
            Tài khoản: <strong>khoa</strong> | Mật khẩu: <strong>khoadeptrai</strong>
        </div>
    </div>

    <!-- Dashboard (sau khi đăng nhập) -->
    <div class="dashboard" id="dashboard">
        <div class="dashboard-content fade-in">
            <h1>Chào mừng Khoa đẹp trai!</h1>
            <p>Bạn đã đăng nhập thành công vào thế giới anime</p>
            <button class="logout-btn" onclick="logout()">ĐĂNG XUẤT</button>
        </div>
    </div>

    <script>
        // Lấy các phần tử DOM
        const loginForm = document.getElementById('loginForm');
        const message = document.getElementById('message');
        const dashboard = document.getElementById('dashboard');
        const bgVideo = document.getElementById('bgVideo');
        const musicControl = document.getElementById('musicControl');
        
        // Biến để theo dõi trạng thái âm thanh
        let isMuted = true;

        // Xử lý đăng nhập
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (username === 'khoa' && password === 'khoadeptrai') {
                // Đăng nhập thành công
                message.textContent = 'Đăng nhập thành công! Chào mừng Khoa đẹp trai!';
                message.className = 'message success';
                message.style.display = 'block';
                
                // Hiệu ứng chuyển trang
                setTimeout(() => {
                    document.querySelector('.login-container').style.display = 'none';
                    dashboard.style.display = 'flex';
                }, 1500);
                
            } else {
                // Đăng nhập thất bại
                message.textContent = 'Sai tên đăng nhập hoặc mật khẩu!';
                message.className = 'message error';
                message.style.display = 'block';
                
                // Hiệu ứng lắc form
                loginForm.style.animation = 'shake 0.5s';
                setTimeout(() => {
                    loginForm.style.animation = '';
                }, 500);
            }
        });

        // Điều khiển âm thanh
        musicControl.addEventListener('click', function() {
            isMuted = !isMuted;
            bgVideo.muted = isMuted;
            musicControl.innerHTML = isMuted ? '<i>🔇</i>' : '<i>🔊</i>';
        });

        // Hàm đăng xuất
        function logout() {
            dashboard.style.display = 'none';
            document.querySelector('.login-container').style.display = 'block';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            message.style.display = 'none';
        }

        // Thêm hiệu ứng lắc cho CSS
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-10px); }
                75% { transform: translateX(10px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
